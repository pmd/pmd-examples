plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'pmd'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
    maven {
        url "https://oss.sonatype.org/content/repositories/snapshots/"
    }
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava

    // Add jrt-fs.jar of the toolchain explicitly on pmdAux classpath, to avoid
    // warning "Adding current platform ... to auxClasspath, which could be the wrong java version."
    pmdAux javaToolchains.launcherFor(java.toolchain)
            .map { it.metadata.installationPath }
            .map { it.files("lib/jrt-fs.jar") }
}

// Apply a specific Java toolchain to ease working on different environments.
// List available toolchains: ./gradlew -q javaToolchains
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.example.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

pmd {
    toolVersion = "7.28.0"
    consoleOutput = true

    //ruleSets = ["category/java/errorprone.xml"] // default
    ruleSets = ["category/java/errorprone.xml", "category/java/bestpractices.xml"]
}

